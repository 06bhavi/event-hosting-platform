---
- name: Base setup for all servers
  hosts: all
  become: true
  roles:
    - common
  tags: common

- name: Deploy the event registration website
  hosts: web
  become: true
  roles:
    - webserver
  tags: web

- name: Install Nagios monitoring server
  hosts: monitoring
  become: true
  vars_prompt:
    - name: nagios_password
      prompt: "Set the Nagios web admin password"
      private: true
      default: "Nagios@123"
  roles:
    - nagios_server
  tags: monitoring

- name: Apply Puppet baseline configuration
  hosts: all
  become: true
  roles:
    - puppet_baseline
  tags: puppet
